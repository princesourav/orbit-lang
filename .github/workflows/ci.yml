name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege at the workflow level; no job here needs write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The DEV TOOLCHAIN matrix: 22 = active LTS, 24 = current.
        #
        # Node 20 is deliberately absent here even though package.json declares
        # `engines: >=20`. pnpm 11 requires Node >= 22.13, so a Node 20 job
        # cannot even install dependencies — it fails in setup, long before it
        # tests anything about Orbit.
        #
        # That is a constraint on the toolchain, not on the library: the engine
        # has zero runtime dependencies and targets ES2022, so it genuinely runs
        # on Node 20. The `node20-compat` job below verifies exactly that claim
        # against the BUILT ARTIFACT, which is what `engines` is actually about.
        node: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Two configs on purpose: the library must typecheck WITHOUT @types/node
      # (that is what keeps the engine zero-I/O), while the CLI is the one file
      # allowed to use it.
      - name: Typecheck (library, node-free)
        run: npx tsc --noEmit

      - name: Typecheck (CLI)
        run: npx tsc -p tsconfig.cli.json --noEmit

      # Build BEFORE test, deliberately.
      #
      # The language server imports `@orbitlang/core` rather than reaching into
      # src/ — which is right, because that is what a real consumer does and it
      # keeps the LSP honest about the public API. Node's self-referencing
      # resolution sends that import through the `exports` map to dist/, so the
      # package has to be built before its own tests can load it.
      #
      # The upside is that the LSP tests then exercise the built artifact, which
      # is the thing an editor actually loads.
      - name: Build (dual ESM/CJS + CLI)
        run: npm run build

      - name: Test
        run: npx vitest run

      - name: Island runtime is within budget and not stale
        # The only artifact here that ships to browsers, so a size regression is
        # paid by every visitor to every page. Failing the build is the point:
        # a budget added after the first regression is a budget set to whatever
        # that regression was.
        run: npm run runtime:check

      - name: Error-code index is not stale
        run: npm run errors:check

      - name: Conformance corpus is not stale
        run: npx vite-node conformance/generate.mjs --check

      - name: llms.txt is not stale
        run: npm run llms:check

      - name: Playground is not stale
        run: npm run playground:check

      - name: Smoke test the CLI
        run: |
          node dist/cli/cli.js --version
          node dist/cli/cli.js check examples/
          node dist/cli/cli.js fmt --check examples/

      - name: Smoke test the built ESM entrypoint
        run: |
          node --input-type=module -e "
            import { parseProgram } from './dist/esm/index.js';
            if (typeof parseProgram !== 'function') throw new Error('ESM entrypoint broken');
            console.log('ESM ok');
          "

      - name: Smoke test the built CJS entrypoint
        run: |
          node -e "
            const { parseProgram } = require('./dist/cjs/index.js');
            if (typeof parseProgram !== 'function') throw new Error('CJS entrypoint broken');
            console.log('CJS ok');
          "

      - name: Assert zero runtime dependencies
        run: |
          node -e "
            const pkg = require('./package.json');
            const deps = Object.keys(pkg.dependencies || {});
            if (deps.length > 0) {
              throw new Error('runtime dependencies are not allowed: ' + deps.join(', '));
            }
            console.log('zero runtime dependencies');
          "

  node20-compat:
    name: built artifact runs on Node 20
    runs-on: ubuntu-latest
    steps:
      # package.json declares `engines: node >=20`. That is a claim about the
      # PUBLISHED PACKAGE, not about the dev toolchain — pnpm 11 needs Node
      # 22.13+, so the build itself cannot run on 20.
      #
      # This job builds on a supported Node, then switches the runtime to 20 and
      # exercises the built artifact. It is a more faithful test of the engines
      # field than running the whole toolchain on 20 would have been: it checks
      # the thing a consumer actually installs.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 22 (to build)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: npm run build

      - name: Switch to Node 20 (the declared minimum)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: The built package loads and works on Node 20
        run: |
          node --version
          node -e "
            const orbit = require('./dist/cjs/index.js');
            const parsed = orbit.parseProgram([
              { name: 'a.orbit', source: '---\npage p\n---\n<p>{title}</p>\n' },
            ]);
            if (!parsed.ok) throw new Error('parse failed on Node 20');
            console.log('CJS ok on Node 20');
          "
          node --input-type=module -e "
            import { parseProgram, render, LIMITS } from './dist/esm/index.js';
            if (typeof parseProgram !== 'function') throw new Error('ESM entrypoint broken');
            if (typeof LIMITS.defaultFuel !== 'number') throw new Error('LIMITS missing');
            console.log('ESM ok on Node 20');
          "
          node dist/cli/cli.js --version
          node dist/cli/cli.js check examples/

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the PR's commit range can be walked.
          fetch-depth: 0
          persist-credentials: false

      - name: Every commit carries a Signed-off-by trailer
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$BASE_SHA..$HEAD_SHA"
          elif [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # Branch creation: only the tip is in scope.
            RANGE="$PUSH_AFTER~1..$PUSH_AFTER"
          else
            RANGE="$PUSH_BEFORE..$PUSH_AFTER"
          fi

          echo "Checking commits in $RANGE"
          MISSING=0
          for sha in $(git rev-list --no-merges "$RANGE"); do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if git show -s --format='%B' "$sha" | grep -qiE "^Signed-off-by: .+ <.+@.+>$"; then
              echo "  ok    $sha  $author"
            else
              echo "  MISS  $sha  $author"
              MISSING=$((MISSING + 1))
            fi
          done

          if [ "$MISSING" -gt 0 ]; then
            echo ""
            echo "$MISSING commit(s) lack a Developer Certificate of Origin sign-off."
            echo "Orbit takes contributions under the DCO, not a CLA. Fix with:"
            echo "  git commit -s            # for new commits"
            echo "  git rebase --signoff <base>   # to sign an existing branch"
            exit 1
          fi
          echo "All commits signed off."

  claims-audit:
    name: claims audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No install step: audit-claims.mjs runs on plain Node with zero
      # dependencies, deliberately, so the honesty gate cannot be broken by a
      # broken dependency tree.
      - name: Every documented claim has live evidence
        run: node scripts/audit-claims.mjs
